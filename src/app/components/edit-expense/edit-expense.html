<div class="container mt-4">
  <div class="card p-4" style="max-width: 500px; margin: auto">
    <h2 class="text-center mb-3">Edit Expense</h2>
    <div class="card mt-3">
      <div class="card-body">
        <div class="mb-3"></div>
        <label class="form-label">Title</label>
        <input type="text" class="form-control" [(ngModel)]="expense.title" />
        <div class="mb-3"></div>
        <label class="form-label">Amount ($)</label>
        <input type="number" class="form-control" [(ngModel)]="expense.amount" />
        <div class="mb-3"></div>
        <label class="form-label">Category</label>
        <select class="form-select" [(ngModel)]="expense.category">
          @for (cat of expenseService.categories(); track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
        <div class="mb-3"></div>
        <button class="btn btn-primary" (click)="save()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
